<iframe srcdoc="<!DOCTYPE html>
<html lang=&quot;en&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<title>ColoWrap Order-By Timeline</title>
<style>
  body { margin:0; font-family:-apple-system,&quot;Segoe UI&quot;,Arial,sans-serif; background:#fff; padding:1.5rem; }
  .muted { color:#898781; }
  .legend { display:flex; gap:14px; font-size:12px; color:#52514e; margin-bottom:1.5rem; flex-wrap:wrap; }
  .dot { display:inline-block; border-radius:50%; }
</style>
</head>
<body>
<div style=&quot;max-width:700px;margin:0 auto;&quot;>
<h2 style=&quot;font-size:16px;font-weight:500;margin:0 0 0.5rem;&quot;>ColoWrap inventory: order-by timeline</h2>
<div id=&quot;status&quot; class=&quot;muted&quot; style=&quot;font-size:12px;margin-bottom:1rem;&quot;>Snapshot from Aug 6, 2026</div>
<div class=&quot;legend&quot;>
  <span><span class=&quot;dot&quot; style=&quot;width:10px;height:10px;background:#A32D2D&quot;></span> Order-by (act now)</span>
  <span><span class=&quot;dot&quot; style=&quot;width:10px;height:10px;background:#0F6E56&quot;></span> Order-by (on track)</span>
  <span><span class=&quot;dot&quot; style=&quot;width:8px;height:8px;background:#888780&quot;></span> Next stockout</span>
  <span><span style=&quot;width:2px;height:10px;background:#378ADD;display:inline-block&quot;></span> Sep 1 delivery</span>
  <span><span style=&quot;width:2px;height:10px;background:#8B5CF6;display:inline-block&quot;></span> Dec 1 delivery</span>
</div>
<div id=&quot;rows&quot;></div>
<div id=&quot;axis&quot; style=&quot;display:flex;justify-content:space-between;font-size:11px;color:#898781;margin-top:4px;padding-left:70px&quot;></div>
</div>
<script>
const TODAY = new Date();
const d1 = new Date(&quot;2026-09-01&quot;);
const d2 = new Date(&quot;2026-12-01&quot;);
const d1Day = Math.round((d1 - TODAY) / 86400000);
const d2Day = Math.round((d2 - TODAY) / 86400000);
const rows = [
  {size:'XK', orderByDays:155, stockoutDays:245},
  {size:'XL', orderByDays:161, stockoutDays:251},
  {size:'L', orderByDays:173, stockoutDays:263},
  {size:'M', orderByDays:190, stockoutDays:280},
  {size:'XXL', orderByDays:203, stockoutDays:293},
  {size:'S', orderByDays:242, stockoutDays:332}
];
rows.sort((a,b) => a.orderByDays - b.orderByDays);
const maxDays = Math.max(...rows.map(r => r.stockoutDays), d2Day) * 1.05;
const pct = d => (d / maxDays * 100).toFixed(1) + '%';
const container = document.getElementById('rows');
rows.forEach(r => {
  const status = r.orderByDays < 0 ? '#A32D2D' : '#0F6E56';
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;align-items:center;height:36px;position:relative';
  row.innerHTML = `
    <div style=&quot;width:54px;font-size:13px;font-weight:500;flex-shrink:0&quot;>${r.size}</div>
    <div style=&quot;flex:1;position:relative;height:2px;background:#e5e4e0&quot;>
      <div style=&quot;position:absolute;left:${pct(d1Day)};top:-8px;width:1px;height:18px;background:#378ADD&quot;></div>
      <div style=&quot;position:absolute;left:${pct(d2Day)};top:-8px;width:1px;height:18px;background:#8B5CF6&quot;></div>
      <div style=&quot;position:absolute;left:${pct(r.stockoutDays)};top:-3px;width:8px;height:8px;border-radius:50%;background:#888780;transform:translateX(-4px)&quot;></div>
      <div style=&quot;position:absolute;left:${pct(r.orderByDays)};top:-5px;width:12px;height:12px;border-radius:50%;background:${status};border:2px solid #fff;transform:translateX(-6px)&quot;></div>
    </div>`;
  container.appendChild(row);
});
const axis = document.getElementById('axis');
const labels = [0, Math.round(maxDays/3), Math.round(maxDays*2/3), Math.round(maxDays)];
labels.forEach(d => {
  const dt = new Date(TODAY.getTime() + d*86400000);
  const span = document.createElement('span');
  span.textContent = dt.toLocaleDateString('en-US', {month:'short', year:'numeric'});
  axis.appendChild(span);
});
</script>
</body>
</html>
" style="width:100%;height:420px;border:none;"></iframe>
